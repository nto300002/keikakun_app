name: CD for Backend

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./k_back
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Debug Secrets Availability
        run: |
          echo "PROD_DATABASE_URL length: ${{ env.PROD_DB_URL_LENGTH }}"
          echo "TEST_DATABASE_URL length: ${{ env.TEST_DB_URL_LENGTH }}"
        env:
          PROD_DB_URL_LENGTH: ${{ secrets.PROD_DATABASE_URL && 'Set' || 'Not Set' }}
          TEST_DB_URL_LENGTH: ${{ secrets.TEST_DATABASE_URL && 'Set' || 'Not Set' }}

      - name: Verify test DB Alembic baseline
        working-directory: ./k_back
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          ALEMBIC_BASELINE_REVISION: baseline_20260701
        run: python scripts/alembic_baseline_guard.py

      - name: Run Alembic migrations for test DB
        working-directory: ./k_back
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: alembic upgrade head

      - name: Verify test DB schema constraints
        working-directory: ./k_back
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          ALEMBIC_BASELINE_REVISION: baseline_20260701
          VERIFY_SCHEMA_CONSTRAINTS: "1"
        run: python scripts/alembic_baseline_guard.py

      - name: Run shared DB cleanup tests serially
        working-directory: ./k_back
        env: &test-env
          TESTING: "1"
          ENVIRONMENT: "test"
          # アプリ設定用URLとテスト実行先を分離する。pytest は TEST_DATABASE_URL を優先する。
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          # E2E専用の既存secretを利用し、本番JWT鍵をrunnerへ渡さない。
          SECRET_KEY: ${{ secrets.E2E_SECRET_KEY }}
          FRONTEND_URL: "http://test.local"
          # 既存secretから注入し、鍵素材をworkflowに固定しない。
          CALENDAR_ENCRYPTION_KEY: ${{ secrets.CALENDAR_ENCRYPTION_KEY }}
          # ダミーのメール情報を追加
          MAIL_USERNAME: "testuser"
          MAIL_PASSWORD: "testpassword"
          MAIL_FROM: "test@example.com"
          MAIL_SERVER: "smtp.example.com"
          MAIL_PORT: "587"
          # ライブラリの仕様に合わせ "1" (True) を使用
          MAIL_DEBUG: "1"
          # 外部課金・Push連携の本番secretはCIへ渡さない。
          STRIPE_PUBLISHABLE_KEY: "test-publishable-key"
          STRIPE_PRICE_ID: "test-price-id"
          VAPID_SUBJECT: "mailto:test@example.com"
        run: pytest -m "serial_db_cleanup and not performance"

      - name: Run Pytest
        working-directory: ./k_back
        env: *test-env
        run: pytest -n auto -m "not performance and not serial_db_cleanup"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get short SHA for Cloud Build
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run using Cloud Build
        id: deploy
        working-directory: ./k_back
        run: |
          gcloud builds submit \
            --config cloudbuild.yml \
            --substitutions=SHORT_SHA="${{ steps.vars.outputs.SHORT_SHA }}",BRANCH_NAME="${{ github.ref_name }}" \
            .
